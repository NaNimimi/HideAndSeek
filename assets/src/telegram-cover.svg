<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A1F6B"/><stop offset="0.6" stop-color="#121628"/><stop offset="1" stop-color="#0B0E14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.5"/><stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9B7BFF"/><stop offset="1" stop-color="#6A45FF"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#grid)"/>
  <!-- streets -->
  <g stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M360 -10 L420 380"/><path d="M300 120 L660 60"/><path d="M330 300 L660 250"/><path d="M560 -10 Q520 180 600 380"/>
  </g>

  <!-- zone -->
  <circle cx="490" cy="180" r="190" fill="url(#glow)"/>
  <g transform="translate(490 180)">
    <circle r="140" fill="none" stroke="#7C5CFF" stroke-width="5" stroke-dasharray="14 10" opacity="0.75"/>
    <circle r="92" fill="#FFB020" opacity="0.07"/>
    <circle r="92" fill="none" stroke="#FFB020" stroke-width="6"/>
    <circle cx="-38" cy="-26" r="34" fill="#2EE59D" opacity="0.2"/>
    <circle cx="-38" cy="-26" r="18" fill="#2EE59D" stroke="#fff" stroke-width="5"/>
    <circle cx="44" cy="30" r="40" fill="#FF4D5E" opacity="0.22"/>
    <circle cx="44" cy="30" r="15" fill="#FF4D5E" stroke="#fff" stroke-width="5"/>
    <circle cx="105" cy="-90" r="15" fill="#FF4D5E" opacity="0.5" stroke="#fff" stroke-opacity="0.6" stroke-width="4"/>
  </g>

  <!-- text -->
  <text x="44" y="150" font-family="Unbounded" font-weight="800" font-size="60" fill="#FFFFFF" letter-spacing="3">ПРЯТКИ</text>
  <text x="46" y="192" font-family="Manrope" font-weight="700" font-size="21" fill="#C9CEDB">Настоящие прятки</text>
  <text x="46" y="220" font-family="Manrope" font-weight="700" font-size="21" fill="#C9CEDB">на карте города</text>
  <rect x="44" y="250" width="190" height="48" rx="24" fill="url(#btn)"/>
  <text x="139" y="281" text-anchor="middle" font-family="Manrope" font-weight="700" font-size="19" fill="#FFFFFF">Играть с друзьями</text>
</svg>
